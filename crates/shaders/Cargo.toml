[package]
name = "shaders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "vfx .shader parser and the HLSL -> DXC -> SPIR-V -> naga -> WGSL translation pipeline"

[dependencies]
blake3 = "1.8"
hassle-rs = "0.12"
naga = { version = "30.0.1", features = ["spv-in", "wgsl-in", "wgsl-out"] }
serde.workspace = true
serde_json.workspace = true
wgpu-types = { version = "30.0.1", features = ["serde"] }
