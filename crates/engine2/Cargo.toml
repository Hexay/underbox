[package]
name = "engine2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "libengine2: the native library s&box's managed engine loads"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi = { path = "../abi" }
anim = { path = "../anim" }
assets = { path = "../assets" }
audio = { path = "../audio" }
box2d-sys = { path = "../box2d-sys" }
glam = "0.33"
gns = { path = "../gns" }
kv = { path = "../kv" }
lz4_flex = "0.14.0"
objects = { path = "../objects" }
physics = { path = "../physics" }
platform = { path = "../platform" }
render = { path = "../render" }
serde.workspace = true
serde_json.workspace = true
shaders = { path = "../shaders" }
window = { path = "../window" }
world = { path = "../world" }

[features]
default = ["audio-device"]
steam = ["platform/steam"]
# Sound output and microphone capture through cpal (links libasound on Linux).
audio-device = ["audio/device"]
