[package]
name = "engine2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "libengine2: the native library s&box's managed engine loads"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi = { path = "../abi" }
assets = { path = "../assets" }
gns = { path = "../gns" }
lz4_flex = "0.14.0"
objects = { path = "../objects" }
physics = { path = "../physics" }
platform = { path = "../platform" }
serde_json.workspace = true

[features]
steam = ["platform/steam"]
