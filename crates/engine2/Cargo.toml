[package]
name = "engine2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "libengine2: the native library s&box's managed engine loads"

# No doctests and no tests in the bin: without these, every `cargo test` also compiled engine2 a
# second time (docs/dev-loop.md, "Test targets"). A doctest or bin test added later won't run.
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "coverage"
path = "src/bin/coverage.rs"
test = false

[dependencies]
abi = { path = "../abi" }
anim = { path = "../anim" }
assets = { path = "../assets" }
audio = { path = "../audio" }
box2d-sys = { path = "../box2d-sys" }
glam = "0.33"
gns = { path = "../gns" }
half = "2"
kv = { path = "../kv" }
lz4_flex = "0.14.0"
objects = { path = "../objects" }
physics = { path = "../physics" }
platform = { path = "../platform" }
render = { path = "../render" }
rustc-hash = "2"
serde.workspace = true
serde_json.workspace = true
shaders = { path = "../shaders" }
window = { path = "../window" }
world = { path = "../world" }

[features]
default = ["audio-device"]
steam = ["platform/steam"]
# Sound output and microphone capture through cpal (links libasound on Linux).
audio-device = ["audio/device"]
