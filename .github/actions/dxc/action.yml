name: dxc
description: Microsoft's pinned DXC release (tools/fetch-dxc.sh), cached, exported as UNDERBOX_DXC_DIR.
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dxc
        key: dxc-${{ runner.os }}-${{ hashFiles('tools/fetch-dxc.sh') }}
    - shell: bash
      env:
        UNDERBOX_DXC_DIR: ${{ runner.temp }}/dxc
      run: |
        sh tools/fetch-dxc.sh
        echo "UNDERBOX_DXC_DIR=$UNDERBOX_DXC_DIR" >> "$GITHUB_ENV"
