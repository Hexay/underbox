name: linux-deps
description: System packages for the workspace build and the lavapipe render tests on Ubuntu.
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    # A warm cache installs the .debs without touching the mirror (it has had multi-hour outages).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs
        key: apt-${{ steps.image.outputs.id }}-${{ hashFiles('.github/actions/linux-deps/action.yml') }}
    # GNS: cmake, protobuf, OpenSSL. SDL3 (crates/window): X11 and its extensions, udev for gamepads,
    # D-Bus for portals and IME. lavapipe: software Vulkan for the wgpu tests on a GPU-less runner.
    # No libasound2-dev: libasound is dlopened (.cargo/config.toml, crates/audio/src/alsa_dl).
    - shell: bash
      env:
        DEBS: ${{ runner.temp }}/apt-debs
        APT: -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30
        PKGS: >-
          cmake protobuf-compiler libprotobuf-dev libssl-dev
          libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev
          libudev-dev libdbus-1-dev
          mesa-vulkan-drivers libvulkan1
      run: |
        if ls "$DEBS"/*.deb > /dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb > /dev/null; then exit 0; fi
        mkdir -p "$DEBS/partial"
        sudo apt-get $APT update
        sudo apt-get $APT install -y --no-install-recommends -o Dir::Cache::archives="$DEBS" $PKGS
        # apt's root-only lock file would make the cache save fail.
        sudo rm -rf "$DEBS/lock" "$DEBS/partial"
        sudo chown -R "$(id -u)" "$DEBS"
