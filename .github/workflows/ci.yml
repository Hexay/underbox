name: ci
on:
  push:
    paths-ignore: &docs ["**.md", "docs/**", "research/**", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# A newer push supersedes an in-flight run, except on main, where every commit gets a full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo: smaller caches, faster links (most of all MSVC's PDBs).
  CARGO_PROFILE_DEV_DEBUG: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

# Every job skips a pull_request from this repo's own branches: their push run already covers it.
jobs:
  clippy:
    if: &not-own-pr github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Lints never come from a cache: sccache doesn't hash clippy's configuration.
      RUSTC_WRAPPER: ""
    steps:
      # Not recursive: GNS's nested submodules (webrtc, abseil, vjson) are for ICE and its tools, both off.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        timeout-minutes: 10
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    if: *not-own-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        timeout-minutes: 10
      - uses: ./.github/actions/dxc
      - uses: ./.github/actions/rust
      - run: cargo test --workspace --no-fail-fast

  windows:
    if: *not-own-pr
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_ROOT: C:\vcpkg
      # The Visual Studio generators ignore the compiler launcher, so sccache needs Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Saved right after install, not at job end: the build takes ~28 min and must survive a failed job.
      - id: vcpkg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-protobuf-x64-windows-static-md-v1
      - if: steps.vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install protobuf:x64-windows-static-md
      - if: steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-protobuf-x64-windows-static-md-v1
      - uses: ./.github/actions/dxc
      - uses: ./.github/actions/rust
      # No clippy here: Linux lints the same code, and a check pass shares no artifacts with test.
      - run: cargo test --workspace --no-fail-fast

  # The release libengine2, built on the oldest supported distro so its glibc symbol versions are
  # the baseline; dist-check fails on any other dynamic dependency (docs/release.md).
  dist:
    if: *not-own-pr
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 30
    env:
      DIST_GLIBC_MAX: "2.35"
    steps:
      # .debs cached as in .github/actions/linux-deps, which can't run before the checkout. Bump the
      # key with the package list.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/underbox-debs
          key: apt-dist-ubuntu-22.04-v1
      # git before checkout, or it downloads a tarball without submodules.
      - timeout-minutes: 10
        env:
          DEBS: /var/cache/underbox-debs
          APT: -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30
        run: |
          if ls "$DEBS"/*.deb > /dev/null 2>&1 && dpkg -i "$DEBS"/*.deb > /dev/null; then exit 0; fi
          mkdir -p "$DEBS/partial"
          apt-get $APT update
          apt-get $APT install -y --no-install-recommends -o Dir::Cache::archives="$DEBS" \
            git ca-certificates curl unzip build-essential cmake pkg-config libssl-dev \
            libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libudev-dev libdbus-1-dev
          rm -rf "$DEBS/lock" "$DEBS/partial"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # The workspace belongs to another uid inside the container; dist.sh reads its git hash.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/rust
      - run: sh tools/dist.sh
      # A tarball keeps the module symlinks; upload-artifact would copy libengine2 once per link.
      - run: tar -czf libengine2-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libengine2-linux-x64
          path: libengine2-linux-x64.tar.gz
