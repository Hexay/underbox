name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo: smaller rust-cache, faster links (most of all MSVC's PDBs).
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    runs-on: ubuntu-24.04
    # clippy's workspace wrapper gives workspace crates their own build-script runs, so the GNS and
    # SDL cmake builds would compile twice per job; sccache serves the second (and the next run's).
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      # Not recursive: GNS's nested submodules (webrtc, abseil, vjson) are for ICE and its tools, both off.
      - uses: actions/checkout@v5
        with:
          submodules: true
      # No libasound2-dev: libasound is dlopened (.cargo/config.toml, crates/audio/src/alsa_dl).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake protobuf-compiler libprotobuf-dev libssl-dev
      # SDL3 (crates/window): X11 and its extensions, udev for gamepads, D-Bus for portals and IME.
      - run: sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libudev-dev libdbus-1-dev
      # lavapipe: software Vulkan, so the wgpu render tests run on a GPU-less runner.
      - run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: sccache --show-stats

  # The release libengine2, built on the oldest supported distro so its glibc symbol versions are
  # the baseline; dist-check fails on any other dynamic dependency (docs/release.md).
  dist:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      DIST_GLIBC_MAX: "2.35"
    steps:
      # git before checkout, or it downloads a tarball without submodules.
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl unzip build-essential cmake pkg-config libssl-dev
      - run: apt-get install -y --no-install-recommends libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libudev-dev libdbus-1-dev
      - uses: actions/checkout@v5
        with:
          submodules: true
      # The workspace belongs to another uid inside the container; dist.sh reads its git hash.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sh tools/dist.sh
      # A tarball keeps the module symlinks; upload-artifact would copy libengine2 once per link.
      - run: tar -czf libengine2-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: libengine2-linux-x64
          path: libengine2-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # Saved right after install, not at job end: the build takes ~28 min and must survive a failed job.
      - id: vcpkg
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-protobuf-x64-windows-static-md-v1
      - if: steps.vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install protobuf:x64-windows-static-md
      - if: steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-protobuf-x64-windows-static-md-v1
      - uses: dtolnay/rust-toolchain@stable
      # Without cache-on-failure a red job saves nothing and the next run is cold again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # No clippy here: Linux lints the same code, and a check pass shares no artifacts with test.
      - run: cargo test --workspace --no-fail-fast
