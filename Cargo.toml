[workspace]
members = ["crates/*", "tools/abigen"]
exclude = ["third_party/rapier3d"]
resolver = "3"

# Rapier with kinematic bodies colored like fixed ones: third_party/rapier3d/UNDERBOX.md.
[patch.crates-io]
rapier3d = { path = "third_party/rapier3d" }

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
abi-spec = { path = "crates/abi-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unoptimized naga stalled hud's first UI frame ~15 s (docs/renderer.md, Slow first frames).
[profile.dev.package.naga]
opt-level = 3

# Shader translation's string scanning; see docs/dev-loop.md (test targets).
[profile.dev.package.shaders]
opt-level = 3
